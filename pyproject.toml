[project]
name = "ashare-mcp"
version = "0.1.0"
description = "Production-grade China A-share data MCP server (akshare primary; baostock/tushare fallback). Supports stdio and Streamable HTTP transports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CharmYue" }]
keywords = ["mcp", "akshare", "a-share", "stock", "finance", "fastmcp"]
dependencies = [
  "fastmcp>=3.0",
  "akshare>=1.18.0",
  "baostock>=0.8",
  "pandas>=2.0",
  "loguru>=0.7",
  "pydantic-settings>=2.0",
  "tenacity>=8.0",
]

[project.urls]
Homepage = "https://github.com/CharmYue/ashare-mcp"
Repository = "https://github.com/CharmYue/ashare-mcp"
Issues = "https://github.com/CharmYue/ashare-mcp/issues"

[project.optional-dependencies]
tushare = ["tushare>=1.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ashare-mcp = "ashare_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
